apiVersion: v1
kind: Secret
metadata:
  name: database-admin-credential
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: password
type: kubernetes.io/basic-auth
data:
  username: YWRtaW4K
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.cluster.name | default "cluster-example" }}
  labels:
    {{- with .Values.labels }}
    {{ toYaml . | nindent 4 }}
    {{- end }}
spec:
  instances: {{ .Values.cluster.instances | default 3 }}
  bootstrap:
    initdb:
      database: {{ .Values.cluster.bootstrap.initdb.database | default "app" }}
      owner: {{ .Values.cluster.bootstrap.initdb.owner | default "app" }}
      secret:
        name: database-admin-credential
  storage:
    size: {{ .Values.cluster.storage.size | default "1Gi" }}
